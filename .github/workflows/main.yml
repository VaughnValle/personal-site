# GitHub Action to automatically sync the fork with the upstream repository

name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *' # This runs the action every hour
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # This first step checks out your repository so the workflow can access it
      - uses: actions/checkout@v4
        with:
          # We need a token with repo permissions to push to the fork
          token: ${{ secrets.GITHUB_TOKEN }}

      # This is the step that performs the sync
      - name: Sync fork repository
        uses: tgymnich/fork-sync@v1.2
        with:
          # This is the line that was missing
          github_token: ${{ secrets.GITHUB_TOKEN }}
          owner: louisescher
          head: master # Or master, depending on the default branch name in the original repo
          base: main # Or master, depending on the default branch name in your fork
